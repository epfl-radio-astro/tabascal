model:
  components:
  # RFI Phase from trajectory
    - trajectory:FixedOrbit
  # RFI signal model
    - rfi_signal:ComplexRFIVarAnt
    - rfi_vis:RiemannVis
  # Astronomical signal model
    - ast_vis:GPVisAst
  # Antenna Gain model
    - gains:UnitaryGains

data:
  data_col: DATA
  noise:

plots:
  init: False
  prior: False
  truth: False
  prior_samples: 100

inference:
  opt: True

opt:
  epsilon: 1e-3
  max_iter: 100
  dual_run: False
  guide: map

# Priors and Initialization
ast:
  init: truth
  mean: 0
  pow_spec:
    p0: 3e3
    k0_freq: 1
    fov_deg: 5
    gammas: [5, 5]
    cutoff: 1e-6
  freq_pad_factor: 2.0
  time_pad_factor: 2.0

rfi:
  init: truth
  mean: 0
  corr_time: 24   # seconds
  freq_pad_factor: 2.0
  time_pad_factor: 2.0
  freq_int_samples: 1
  time_int_factor: 5

satellites:
  norad_ids: [20452, 38833, 45854]


# True gains
gains:
  amp_mean: 1.0
  phase_mean: 0.0
  amp_std: 1.0      # %
  phase_std: 1.0    # degrees

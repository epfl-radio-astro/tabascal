model:
  precision: single
  components:
    # RFI Phase from trajectory
    - trajectory.FixedOrbitFine
    # RFI signal model
    - rfi_signal.ComplexRFIVarAntFine:
        init: truth
        mean: 0
        std_jy: max_vis   # the pipeline tests' reference values were measured with it
        corr_time_s: 24
        freq_pad_factor: 2.0
        time_pad_factor: 2.0
    - rfi_vis.RiemannVisFine:
        n_int_freq: 1
        time_int_factor: 5
    # Astronomical signal model
    - ast_vis.GPVisAst:
        init: truth
        mean: 0
        cutoff: 1e-6
        std_jy: 1.5           # Widest true-sky baseline in the 8A simulation is rms|V| = 2.897 Jy
        corr_freq_hz: null    # no frequency roll-off; these observations are single channel
        fov_deg: 5
        gammas: [5, 5]
        freq_pad_factor: 2.0
        time_pad_factor: 2.0
    # Antenna Gain model
    - gains.UnitaryGains

data:
  data_col: DATA
  noise_jy: null

plots:
  init: false
  prior: false
  truth: false
  prior_samples: 100

inference:
  opt: true

opt:
  epsilon: 1e-3
  max_iter: 100
  dual_run: false
  guide: map

satellites:
  norad_ids: [20452, 38833, 45854]

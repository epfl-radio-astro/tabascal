telescope:
  name: MeerKAT
  n_ant: 8

observation:
  target_name: target
  ra: 27.0
  dec: -30.0
  start_time_lha: 0.0
  int_time: 2.0
  n_time: 120
  n_int: 1024
  start_freq: 1.227e9
  chan_width: 209e3
  n_freq: 1
  SEFD: 420
  auto_corrs: False
  no_w: False
  random_seed: 12345

ast_sources:
  point:
    random: 
      n_src: 50
      min_I: 10sigma
      max_I: 1.0
      I_pow_law: 1.6
      si_mean: 0.7
      si_std: 0.2
      n_beam: 5.0
      max_sep: 200.0 # arcseconds
      random_seed: 123456

rfi_sources:
  tle_satellite:
    # Three OneWeb satellites (LEO, ~1200 km) that pass within max_ang_sep of the
    # target during the observation. LEO rather than GPS so the fitted-orbit
    # pipeline cases have an orbit to correct: they start from the previous day's
    # TLEs (tests/data/orbits) while the simulation uses the nearest ones. Listed
    # rather than searched by name so the model always matches the simulation;
    # tabsim simulates in ascending NORAD ID order and rfi.init: truth reads the
    # amplitudes by position, so tab_target.yaml keeps the same sorted list.
    norad_ids: [48058, 48067, 49192]
    # Sets the RFI's visibility SNR, rms|vis_rfi| / complex noise std, to ~8 (aim
    # 5-10). It is linear in power_scale: 1e-3 measured 4.1.
    power_scale: 2e-3
    max_ang_sep: 30  # degrees
    min_alt: 0       # degrees
    vis_step: 1      # minutes

# gains:
#   G0_mean: 1.0
#   G0_std: 0.05
#   Gt_std_amp: 1e-5
#   Gt_std_phase: 1e-3
#   random_seed: 999

output:
  path: ./data
  prefix: pnt_src
  overwrite: True
  zarr: True
  ms: True
  save_rfi_amplitudes: True  # rfi.init: truth reads rfi_tle_sat_A

diagnostics:
  uv_cov: True
  src_alt: True
  rfi_seps: True

dask:
  max_chunk_MB: 100.0

model:
  precision: single
  components:
    - trajectory.FixedOrbit
    - rfi_signal.ComplexRFIVarAnt:
        init: truth
        mean: 0
        cutoff: 1.0e-6
        std: null
        corr_freq: 1.0e9
        corr_time: 38
        gammas: [5, 5]
        freq_pad_factor: 2.0
        time_pad_factor: 2.0
    - rfi_vis.AnalyticVis:
        n_int_freq: 1
    - ast_vis.GPVisAst:
        init: truth
        mean: 0
        cutoff: 1.0e-6
        std: data
        corr_freq: 1.0e9
        fov_deg: 3.1
        gammas: [5, 5]
        freq_pad_factor: 2.0
        time_pad_factor: 2.0
    - gains.UnitaryGains

data:
  data_col: DATA
  noise: null

plots:
  init: false
  truth: false
  prior: false
  opt: false
  losses: false

inference:
  opt: true

opt:
  epsilon: 1.0e-3
  max_iter: 500
  dual_run: false
  guide: map
  trace_path: null

satellites:
  norad_ids_path: starlink_selected_ids.txt

telescope:
  name: SKA-Low
  latitude: -26.82472208
  longitude: 116.7644482
  elevation: 377 
  dish_d: 40
  itrf_path: SKA-Low-512.itrf.txt
  n_ant: 96

observation:
  target_name: target
  ra: 27.0
  dec: -30.0
  start_time_lha: 0.0
  int_time: 10.0
  n_time: 90
  n_int: 1
  start_freq: 1.5e8
  chan_width: 209e3
  n_freq: 1
  SEFD: 420
  auto_corrs: False
  no_w: False
  random_seed: 12345

ast_sources:
  point:
    random: 
      n_src: 50
      min_I: 10sigma
      max_I: 1.0
      I_pow_law: 1.6
      si_mean: 0.7
      si_std: 0.2
      n_beam: 5.0
      max_sep: 200.0 # arcseconds
      random_seed: 123456

rfi_sources:
  tle_satellite:
    # The satellites ci/reframe/data/tab_target.yaml models. Listed rather than
    # searched by name, so the benchmark's model always matches the simulation
    # whatever the catalogue returns. tabsim simulates them in ascending NORAD ID
    # order, and rfi.init: truth reads them by position, so both lists stay sorted.
    norad_ids: [11141,11690,20361,20959,21890,21930,22231,22275,22877,23953,25030,25933,27663,27704,28129,28190,28874,32711,34661,37753,38857,38858,39533,39741,40105,40294,40534,40544,40890,43057,43565,43567]
    power_scale: 1e-2
    max_ang_sep: 90  # degrees
    min_alt: 0       # degrees
    vis_step: 1      # minutes

output:
  path: ./data
  prefix: pnt_src
  overwrite: True
  zarr: True
  ms: True
  save_rfi_amplitudes: True  # rfi.init: truth reads rfi_tle_sat_A

diagnostics:
  uv_cov: True
  src_alt: True
  rfi_seps: True

dask:
  max_chunk_MB: 100.0

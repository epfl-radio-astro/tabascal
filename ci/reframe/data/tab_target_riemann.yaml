model:
  precision: single
  components:
    - trajectory.FixedOrbitFine
    - rfi_signal.ComplexRFIVarAntFine:
        init: truth
        mean: zeros
        cutoff: 1.0e-6
        std_jy: max_vis
        corr_freq_hz: 1.0e9
        corr_time_s: 38
        gammas: [5, 5]
        freq_pad_factor: 2.0
        time_pad_factor: 2.0
    - rfi_vis.RiemannVisFine:
        n_int_freq: 1
    - ast_vis.GPVisAst:
        init: truth
        mean: zeros
        cutoff: 1.0e-6
        std_jy: data
        corr_freq_hz: 1.0e9
        fov_deg: 3.1
        gammas: [5, 5]
        freq_pad_factor: 2.0
        time_pad_factor: 2.0
    - gains.UnitaryGains

data:
  data_col: DATA
  noise_jy: null

plots:
  init: false
  truth: false
  prior: false
  opt: false
  losses: false


opt:
  epsilon: 1.0e-3
  max_iter: 500
  dual_run: false
  trace_path: null

satellites:
  norad_ids_path: starlink_selected_ids.txt
  extra_orbit_dir: orbits

model:
  components:
  # RFI Phase from trajectory
    - trajectory:FixedOrbit
    # - trajectory:KeplerOrbit
    # - trajectory:PhaseCalculationRFI
  # RFI signal model
    - rfi_signal:ComplexRFIVarAnt
    # - rfi_signal:ComplexRFIConstAnt
  # RFI visibility calculation
    #- rfi_vis:RiemannVis
    - rfi_vis:RiemannVisFFI
    # - rfi_vis:RiemannVisVariable
  # Astronomical signal model
    - ast_vis:GPVisAst
  # Antenna Gain model
    - gains:UnitaryGains

data:
  data_col: DATA
  noise:

plots:
  init: False
  prior: False
  truth: False
  prior_samples: 100

inference:
  opt: True

opt:
  epsilon: 1e-3
  max_iter: 1000
  dual_run: True
  guide: map

# Priors and Initialization
ast:
  init: truth
  mean: 0
  pow_spec:
    p0: 3e3
    k0_freq: 1
    fov_deg: 5
    gammas: [5, 5]
    cutoff: 1e-6
  freq_pad_factor: 2.0
  time_pad_factor: 2.0

rfi:
  init: truth
  mean: 0
  corr_time: 24   # seconds
  freq_pad_factor: 2.0
  time_pad_factor: 2.0
  freq_int_samples: 1
  time_int_factor: 5

satellites:
  norad_ids: [11141,11690,20361,20959,21890,21930,22231,22275,22877,23953,25030,25933,27663,27704,28129,28190,28874,32711,34661,37753,38857,38858,39533,39741,40105,40294,40534,40544,40890,43057,43565,43567]


# True gains
gains:
  amp_mean: 1.0
  phase_mean: 0.0
  amp_std: 1.0      # %
  phase_std: 1.0    # degrees

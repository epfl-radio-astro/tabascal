# tabascal config for the issue #107 RFI-signal component comparison.
#
# Mirrors ci/reframe/data/tab_target.yaml (so results stay comparable to the perf
# check) with two deliberate differences:
#   - satellites are taken from selected_norad_ids.txt rather than a hard-coded
#     list, so the model uses exactly the satellites the simulation contains;
#   - truth-based metrics are enabled, since reconstruction accuracy is one of the
#     three criteria for this comparison.
#
# model.components is overwritten per variant by run_comparison.py.

model:
  components:
    - trajectory:FixedOrbit
    - rfi_signal:ComplexRFI
    - rfi_vis:RiemannVisTimeFreqCalculationFFI
    - ast_vis:FourierTimeFreqGPAst
    - gains:UnitaryGains
  precision: double

data:
  data_col: DATA
  noise:

plots:
  init: False
  prior: False
  truth: True        # enables the truth-metric block used for the accuracy comparison
  prior_samples: 100

inference:
  mcmc: False
  opt: True
  fisher: False

opt:
  epsilon: 1e-3
  max_iter: 1000
  dual_run: True
  guide: map

fisher:
  n_samples: 1
  max_cg_iter: 10_000

# Priors and Initialization
ast:
  init: truth
  mean: 0
  pow_spec:
    p0: 3e3
    k0_freq: 1
    fov_deg: 5
    gammas: [5, 5]
    cutoff: 1e-6
  freq_pad_factor: 2.0
  time_pad_factor: 2.0

rfi:
  init: truth
  mean: 0
  corr_time: 24   # seconds
  n_int_time:
  freq_pad_factor: 2.0
  time_pad_factor: 2.0
  freq_int_samples: 1
  time_int_factor: 5
  pow_spec:
    p0: 1e3
    k0s: [1e0, 1e-2]
    gammas: [5, 5]
    cutoff: 1e-6

satellites:
  norad_ids_path: selected_norad_ids.txt
  ric_std: 1e2

# True gains
gains:
  amp_mean: 1.0
  phase_mean: 0.0
  amp_std: 1.0      # %
  phase_std: 1.0    # degrees
  corr_time: 180    # minutes

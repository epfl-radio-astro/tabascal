##################
# Data parameters
##################
data:
  sim_dir: null           # Optional - Can be provided when running tabascal   
  ms_path: null           # Optional - Can be provided when running tabascal 
  freq: null              # Optional - Defaults to channel 0
  data_col: DATA          # Optional - Defaults to 'DATA'
  corr: xx                # Optional - Defaults to 'xx' polarization, i.e. correlation 0
  noise: null             # Optional - Defaults to reading from the MS file
  flags: false            # Optional - Defaults to not including the flags from the MS file
######################
# Plotting parameters
######################
plots:
  init: false             # Optional - Plot the estimated astronomical and RFI visibilities as well as the gains based on the initial parameter estimate
  truth: false            # Optional - Plot the estimated astronomical and RFI visibilities as well as the gains based on the true parameter estimate
  prior: false            # Optional - Plot the prior distribution over the astronomical and RFI visibilities as well as the gains
  opt: false              # Optional - Plot the estimated astronomical and RFI visibilities as well as the gains based on the optimised parameter estimate
  losses: false           # Optional - Plot the loss curve over the optimisation run
  prior_samples: 100      # Optional - Number of prior samples to use when plotting the prior
#######################
# Inference parameters
#######################
inference:
  opt: true               # Optional - Whether to run the optimization to find optimal (MAP) parameters
  fisher: false           # Optional - Whether to run the Fisher covariance prediction at the optimal (MAP) location found
  mcmc: false             # Optional - Whether to run MCMC to sample the posterior distribution
##########################
# Optimization parameters
##########################
opt:
  epsilon: 1e-2           # Optional - Step size in the optimization run
  max_iter: 500           # Optional - Maximum number of iterations to run the optimization for
  guide: map              # Optional - The type of optimization to run. Currently only 'map' is possible
  dual_run: true          # Optional - Whether to continue optimzation for a second run using a step size 10x smaller
################################################
# Fisher-based covariance prediction parameters
################################################
fisher:
  max_cg_iter: 10000     # Optional - Maximum number of conjugate gradient steps to use when when estimating the Fisher-based covariance estimate
  n_samples: 1           # Optional - Number of samples to use for the Fisher-based covariance estimate 
###################################################
# Astronomical prior and initialization parameters
####################################################
ast:
  init: sample          # Optional - The initialization method for the astronomical visibility parameters. Options are 'est', 'prior', 'truth', 'truth_mean'
  mean: 0               # Optional - Mean of the prior distribution for the astronomical visibility parameters. Options are 0, 'est', 'prior', 'truth', 'truth_mean'
  pow_spec:
    P0: null            # Optional - Power spectrum value at k=0 for the astronomical visibility parameters prior standard deviation 
    gamma: 1.0          # Optional - Exponential of the power law section of the power spectrum for astronomical visibility parameters
    k0: 1e-3            # Optional - Position of the knee of the power spectrum
##########################################
# RFI prior and initialization parameters
##########################################
rfi:
  est: null
  init: sample          # Optional - The initialization method for the RFI signal parameters. Options are 'est', 'prior', 'truth'
  mean: 0               # Optional - Mean of the prior distribution for the astronomical visibility parameters. Options are 0, 'est', 'truth'
  var: null             # Optional - Variance of the RFI signal in Jy. When null an estimate is made based on the data
  corr_time: 24         # Optional - Correlation time of the RFI signal in seconds
  corr_freq: 1e6        # Optional - Correlation bandwidth of the RFI signal in Hz
  time_pad_factor: 2
  freq_pad_factor: 2
  time_int_factor: 1    # Optional - Factor to increase the number of time integration samples over the predicted value
  min_time_bins: 1      # Optional - Minimum number of stride groups when binning per-baseline RFI sampling rates (RiemannVisTimeFreqVariable / +FFI)
  max_time_bins: 30     # Optional - Maximum number of stride groups when binning per-baseline RFI sampling rates (RiemannVisTimeFreqVariable / +FFI)
  n_int_time: null      # Optional - Specify the number of integration samples to use along the time axis
  n_int_freq: 1         # Optional - Specify the number of integration samples to use along the frequency axis
  r_seed: 123           # Optional - Random seed to use for sampling
############################
# Satellite path parameters
############################
satellites:
  norad_ids_path: null  # Optional - Path to a text file of NORAD IDs to include, one per line ('#' comments and blank lines ignored). Takes precedence over norad_ids; the -np/--norad-path CLI flag takes precedence over both
  norad_ids: []         # Optional - NORAD IDs of satellites to include. TLEs are fetched from IAU CPS SatChecker (no credentials required). Every listed ID must resolve to an acceptable TLE or the run stops before subtraction
  extra_tle_dir: null   # Optional - Extra directory of local TLE files searched (per NORAD ID) before the managed cache and SatChecker
  extra_tle_max_age_days: null      # Optional - Max |TLE epoch - observation epoch| (days) to accept an extra_tle_dir TLE. null = unlimited (keeps exact used_tles replay working); 0 = exact-epoch only; negative is an error
  remote_tle_max_age_days: 3        # Optional - PROVISIONAL hard ceiling on the age of a TLE accepted from SatChecker or the managed cache. Not a claim of 3-day accuracy - an emergency backstop, revisited by issue #101. null is an expert opt-out that removes the ceiling
  tle_catalogue_interval_hours: 2   # Optional - Width (hours; minimum 1 second) of the fixed UTC bucket used to reuse a catalogue snapshot. The cached record is nearest to the bucket midpoint, not the exact observation
  tle_catalogue_settle_days: 45     # Optional - Observation epochs younger than this are treated as still settling upstream, so their catalogue is cached provisionally rather than as an immutable snapshot. An observed defensive policy, not a SatChecker guarantee and not a TLE-age allowance
  tle_provisional_cache_hours: 12   # Optional - Lifetime of a provisional catalogue snapshot, which exists only to avoid repeating a multi-megabyte download within a session
  sat_ids: []           # Optional - Satellite IDs of satellites with circular trajectories to include
  ole_path: null        # Optional - Path to the csv '.ole' file containing circular trajectory-based satellite orbit parameters
###########################################
# Gain prior and initialization parameters
###########################################
gains:
  init: prior           # Optional - The initialization method for the gain parameters. Options are 'prior', 'truth'
  amp_mean: 1.0         # Optional - Mean of the prior distribution over the gain amplitudes. Options are 'truth' or a value like 1.0
  phase_mean: 0.0       # Optional - Mean of the prior distribution over the gain phases, in radiands. Options are 'truth' or a value like 0.0
  amp_std: null          # Optional - Standard deviation of the prior distribution over the gain amplitudes as a percentage
  phase_std: null        # Optional - Standard deviation of the prior distribution over the gain phases in degrees
  amp_corr_freq: null        # Optional - Correlation time of the gains in minutes
  amp_corr_time: null        # Optional - Correlation time of the gains in minutes
  phase_corr_freq: null        # Optional - Correlation time of the gains in minutes
  phase_corr_time: null        # Optional - Correlation time of the gains in minutes
  r_seed: 123
# ###################
# # Model parameters
# ###################
model:
  precision: single

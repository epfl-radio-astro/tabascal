##################
# Data parameters
##################
data:
  sim_dir: null           # Optional - Can be provided when running tabascal   
  ms_path: null           # Optional - Can be provided when running tabascal 
  freq: null              # Optional - Defaults to channel 0
  data_col: DATA          # Optional - Defaults to 'DATA'
  corr: xx                # Optional - Correlation to model, matched against the MS's POLARIZATION::CORR_TYPE
  noise: null             # Optional - Defaults to reading from the MS file. NOTE it is in the frame of data_col, i.e. BEFORE gain_table is applied - with a gain table, leave it null and let SIGMA carry it rather than pre-scaling it by hand
  gain_table: null        # Optional - Path to a CASA calibration table, or an ordered list of them, to divide out of the data AND the noise at read time. Everything downstream then lives in the calibrated frame, and the gains are applied once rather than on every forward pass. This replaces hand-scaling noise by k and ast.pow_spec.p0 by k^2
  flags: false            # Optional - Defaults to not including the flags from the MS file
  save_rfi_per_sat: false # Optional - Also store the fitted RFI visibility split per satellite (rfi_vis_src) in the results zarr, for per-NORAD imaging. Costs ~n_rfi x the rfi_vis storage and n_rfi extra forward-op evaluations, hence off by default
######################
# Plotting parameters
######################
plots:
  init: false             # Optional - Plot the estimated astronomical and RFI visibilities as well as the gains based on the initial parameter estimate
  truth: false            # Optional - Plot the estimated astronomical and RFI visibilities as well as the gains based on the true parameter estimate
  prior: false            # Optional - Plot the prior distribution over the astronomical and RFI visibilities as well as the gains
  opt: false              # Optional - Plot the estimated astronomical and RFI visibilities as well as the gains based on the optimised parameter estimate
  losses: false           # Optional - Plot the loss curve over the optimisation run
  prior_samples: 100      # Optional - Number of prior samples to use when plotting the prior
#######################
# Inference parameters
#######################
inference:
  opt: true               # Optional - Whether to run the optimization to find optimal (MAP) parameters
  fisher: false           # Optional - Whether to run the Fisher covariance prediction at the optimal (MAP) location found
  mcmc: false             # Optional - Whether to run MCMC to sample the posterior distribution
##########################
# Optimization parameters
##########################
opt:
  epsilon: 1e-2           # Optional - Step size in the optimization run
  max_iter: 500           # Optional - Maximum number of iterations to run the optimization for
  guide: map              # Optional - The type of optimization to run. Currently only 'map' is possible
  dual_run: true          # Optional - Whether to continue optimzation for a second run using a step size 10x smaller
  trace_path: null        # Optional - Path to write an .npz trace of the per-iteration loss, wall-clock time and reduced chi^2 to. null disables it. Overridden by the TAB_LOSS_TRACE environment variable
################################################
# Fisher-based covariance prediction parameters
################################################
fisher:
  max_cg_iter: 10000     # Optional - Maximum number of conjugate gradient steps to use when when estimating the Fisher-based covariance estimate
  n_samples: 1           # Optional - Number of samples to use for the Fisher-based covariance estimate 
###################################################
# Astronomical prior and initialization parameters
####################################################
ast:
  point_sources: null   # Optional - Fixed (non-fitted) sources for ast_signal:FixedDiscreteSky + ast_vis:DiscreteSkyVis. Either a path to an OSKAR 12-column sky model file or an inline list, e.g. [{name: Fornax A, ra: 50.6738, dec: -37.2083, I: 750.0, ref_freq_mhz: 154.0, alpha: -0.77}] (ra/dec in degrees, I in Jy at ref_freq_mhz). A rigid sky the gain cannot deform, so it anchors a per-antenna gain that a flexible sky model would otherwise absorb
  baseline_block_size: 128 # Optional - Number of baselines transformed per scan step in ast_vis:GPVisAst, or null for a single block over every baseline. Trades scan steps for peak memory: the padded Fourier grid the transform builds and crops is (baseline_block_size, n_freq * freq_pad_factor, n_time * time_pad_factor) rather than (n_bl, ...). Unlike the RFI scans there is no checkpoint on it - the transform is linear, so reverse mode stores nothing to recompute
  source_block_size: 128 # Optional - Number of discrete sources handled per scan step in ast_vis:DiscreteSkyVis. Trades recomputation for peak memory: the delay array is (n_bl, n_time, source_block_size) rather than (n_bl, n_time, n_src)
  uvw_sign: [-1, -1, -1] # Optional - Sign applied to each of the u, v and w axes of the MS UVW column by ast_vis:DiscreteSkyVis, each exactly +1 or -1. It turns that column into the ANTENNA2 - ANTENNA1 baseline the visibility equation is written for, so the right value is a property of whatever wrote the data. The default matches tab-sim, which writes ants_uvw[a1] - ants_uvw[a2]; the opposite convention needs [1, 1, 1] and getting it wrong mirrors the fixed sky through the phase centre
  init: sample          # Optional - Where the astronomical visibility parameters start. Options are 'sample' (one draw from the prior), 'prior' (the prior mean, i.e. whatever mean is set to), 'data' (the observed visibilities, RFI and all, attributed to the sky), 'zeros' (an identically zero sky) and 'truth' (the simulated sky, read from the tab-sim zarr beside the MS)
  mean: 0               # Optional - Mean of the prior distribution over the astronomical visibility parameters. Options are 0, equivalently 'zeros', and 'data' (the observed visibilities)
  pow_spec:             # Optional - Prior covariance of the astronomical visibilities, as the power spectrum of the signal in the Fourier domain. Read by ast_vis:GPVisAst
    p0: 3e3             # Optional - Power at k=0, i.e. the variance scale of the signal, in the squared units of the data. It is the scale of the data and is worth setting to match it
    k0_freq: 1          # Optional - Position of the knee of the power spectrum along the frequency axis, in inverse Hz
    fov_deg: null       # Optional - Full field of view (angular diameter, in degrees) setting the knee along the time axis, through the maximum astronomical fringe rate of a source at fov_deg / 2 from the phase centre. null uses the primary beam of the telescope, 2 * 1.22 * lambda / D, from the dish diameter in the MS file
    gammas: [5, 5]      # Optional - Rate of drop off of the power law section of the power spectrum along the (frequency, time) axes. As gamma -> infinity the power spectrum tends to a Gaussian
    cutoff: 1e-6        # Optional - Relative cutoff on the power spectrum. Fourier modes whose power is below p0 * cutoff are dropped and not fitted
  freq_pad_factor: 2.0  # Optional - Zero padding factor of the frequency axis of the Fourier domain signal model. 1.0 is the observed band itself, which makes the solution periodic over it
  time_pad_factor: 2.0  # Optional - Zero padding factor of the time axis. The time axis equivalent of freq_pad_factor
##########################################
# RFI prior and initialization parameters
##########################################
rfi:
  est: null             # Optional - Path to a measured light-curve file (.npz or .zarr) used by init/mean 'est'. Not needed for 'matched-filter'
  init: sample          # Optional - The initialization method for the RFI signal parameters. Options are 'prior', 'est', 'matched-filter' (alias 'mf'), 'truth', 'zeros', 'ones', 'sample'. 'matched-filter' estimates the light curves from the visibilities already in memory - no imaging step and no est file
  mean: 0               # Optional - Mean of the prior distribution for the RFI signal parameters. Options are 0/'zeros', 'data', 'est', 'matched-filter' (alias 'mf')
  var: null             # Optional - Variance of the RFI signal in Jy. When null an estimate is made based on the data
  min_elevation: 0      # Optional - Elevation in degrees below which the RFI signal of a satellite is masked to zero. 0 masks a satellite only while it is below the geometric horizon. Set to null to disable masking entirely
  corr_time: 24         # Optional - Correlation time of the RFI signal in seconds
  corr_freq: 1e6        # Optional - Correlation bandwidth of the RFI signal in Hz
  time_pad_factor: 2
  freq_pad_factor: 2
  time_int_factor: 1    # Optional - Factor to increase the number of integration samples per time step of the RFI fine grid over the estimate. The count itself is always estimated from the observation and its RFI sampling requirements (see TabConfig.estimate_rfi_sampling) and cannot be given directly - this factor is the knob on that axis
  min_time_bins: 1      # Optional - Minimum number of stride groups when binning per-baseline RFI sampling rates (RiemannVisVariable / +FFI)
  max_time_bins: 30     # Optional - Maximum number of stride groups when binning per-baseline RFI sampling rates (RiemannVisVariable / +FFI)
  n_int_freq: 1         # Optional - Number of integration samples per frequency channel of the RFI fine grid. Given directly - there is no estimate on this axis, which is why it takes a count where the time axis takes a factor
  baseline_block_size: 128 # Optional - Number of baselines handled per scan step in rfi_vis:RiemannVis, or null for a single block over every baseline. Trades recomputation for peak memory: the fine grid it integrates carries min(baseline_block_size, n_bl) on its baseline axis rather than n_bl. null keeps the checkpoint, so the reverse pass still recomputes that grid rather than storing it, but forms it whole - it bounds the tape and not the peak. Read by no other component - the FFI kernels bound the same term themselves
  r_seed: 123           # Optional - Random seed to use for sampling
############################
# Satellite path parameters
############################
satellites:
  norad_ids_path: null  # Optional - Path to a text file of NORAD IDs to include, one per line ('#' comments and blank lines ignored). Takes precedence over norad_ids; the -np/--norad-path CLI flag takes precedence over both
  norad_ids: []         # Optional - NORAD IDs of satellites to include. Orbital records (TLE or OMM) are fetched from IAU CPS SatChecker (no credentials required). Every listed ID must resolve to an acceptable record or the run stops before subtraction. Empty is valid only for a model with no satellite trajectory component
  extra_orbit_dir: null           # Optional - Extra directory of local orbit files (TLE or OMM) searched (per NORAD ID) before the managed cache and SatChecker
  extra_orbit_max_age_days: null  # Optional - Max |record epoch - observation epoch| (days) to accept an extra_orbit_dir record. null = unlimited (keeps exact used_orbits replay working); 0 = exact-epoch only; negative is an error
  remote_max_age_days: 3          # Optional - PROVISIONAL hard ceiling on the age of a record accepted from SatChecker or the managed cache. Not a claim of 3-day accuracy - an emergency backstop, revisited by issue #101. null is an expert opt-out that removes the ceiling
  cache_reuse_max_age_days: 1     # Optional - A cached SatChecker record this close to the observation avoids a new nearest-record request. Older cached records within remote_max_age_days remain offline fallbacks. null always reuses the nearest acceptable cached record
  sat_ids: []           # Optional - Satellite IDs of satellites with circular trajectories to include
  ole_path: null        # Optional - Path to the csv '.ole' file containing circular trajectory-based satellite orbit parameters
###########################################
# Gain prior and initialization parameters
###########################################
gains:
  init: prior           # Optional - The initialization method for the gain parameters. Only gains:ConstGains reads it, and it accepts 'prior' or a path to an .npz of per-antenna gains (key 'gain') or to a calibration table, projected into its gauge. gains:UnitaryGains ignores it entirely - it fits no gain at all
  ref_ant: null         # Optional - Phase reference antenna for gains:ConstGains, whose phase is pinned to 0. Defaults to the first antenna with any unflagged data
  fix_flux_scale: true  # Optional - Keep the zero-sum log-amplitude gauge of gains:ConstGains, so the gain carries no absolute flux scale. false frees the overall amplitude and requires a fixed-flux sky (ast_signal:FixedDiscreteSky) to set the scale
  amp_mean: 1.0         # Optional - Mean of the prior distribution over the gain amplitudes. Options are 'truth' or a value like 1.0
  phase_mean: 0.0       # Optional - Mean of the prior distribution over the gain phases, in radiands. Options are 'truth' or a value like 0.0
  amp_std: null         # Optional - Standard deviation of the prior distribution over the gain amplitudes as a percentage of amp_mean. null defaults to 20, i.e. a 20 % spread
  phase_std: null       # Optional - Standard deviation of the prior distribution over the gain phases in degrees. null defaults to 180, half a turn, which is effectively uniform over the circle - the wrapped prior is flat to 1.4 %
  r_seed: 123           # Optional - Random seed for the gain draws. Only null takes the default; 0 is a seed like any other
# ###################
# # Model parameters
# ###################
model:
  precision: single
#   func: fixed_orbit_rfi_full_fft_standard_model

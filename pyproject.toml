[build-system]
requires = [
    "scikit-build-core>=0.10",
    "jax==0.6.0", # Use minimum FFI api to build
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
cmake.source-dir = "."
wheel.packages = ["tabascal"]
wheel.py-api = "py3"

[[tool.scikit-build.overrides]]
if.env.TABASCAL_CUDA = "(?i)1|on|true|yes"
cmake.define.TABASCAL_CUDA = "ON"

[[tool.scikit-build.overrides]]
if.env.TABASCAL_ROCM = "(?i)1|on|true|yes"
cmake.define.TABASCAL_ROCM = "ON"

# ── Project metadata ───────────────────────────────────────────────────────────

[project]
name = "tabascal"
version = "0.0.1"
license = {file = "LICENSE"}
readme = "README.md"
authors = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"},
]
maintainers = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"}
]
description = "Trajectory based Radio Frequency Interference (RFI) subtraction and calibration using Bayesian methods for radio interferometeric data."

requires-python = ">=3.10"
dependencies = [
    "astropy",
    "dask",
    "dask-ms",
    "jax>=0.6.0,<0.10",
    "matplotlib",
    "numpy",
    "numpyro",
    "optax",
    "platformdirs",
    "PyYAML",
    "sgp4jax",
    "skyfield",
    "spacetrack",
    "tqdm",
    "xarray",
]

[project.optional-dependencies]
test  = ["pytest", "pytest-cov", "huggingface-hub", "tabsim"]
docs  = ["sphinx", "sphinx-rtd-theme"]
dev   = ["pre-commit", "reframe-hpc", "tabascal[test,docs]"]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]

[project.urls]
Repository = "https://github.com/epfl-radio-astro/tabascal.git"

[project.scripts]
tabascal = "tabascal.scripts.run_tabascal:main"
tab2MS = "tabascal.scripts.results_to_MS:main"

# ── Pytest ─────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
log_cli       = true
log_cli_level = "WARNING"

# ── Pixi ──────────────────────────────────────────────────────────────────────
# name / version / description / python are inherited from [project] above.

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "linux-aarch64"]

# ── Tasks ──────────────────────────────────────────────────────────────────────

[tool.pixi.feature.dev.tasks]
build-ffi = { cmd = "pixi reinstall -e $PIXI_ENVIRONMENT_NAME tabascal", description = "Rebuild the CPU FFI shared library (libtabascal.so) via scikit-build-core/CMake" }
test           = "pytest tests/"
test-components = { cmd = "pytest tests/components/", description = "Run component tests only" }
docs-build     = "sphinx-build -b html docs/ docs/_build/html"
docs-clean     = { cmd = "rm -rf docs/_build", description = "Remove built docs" }
perf-test      = { cmd = "reframe -C ci/reframe/settings.py -c ci/reframe/tabascal_perf_check.py --system=generic --exec-policy=serial --run --performance-report --report-file=reframe_results.json", description = "Run Re-Frame performance benchmark locally" }

# ── Shared conda dependencies (all environments) ───────────────────────────────

[tool.pixi.dependencies]
astropy         = "*"
casacore        = "*"
cxx-compiler    = "*"
dask            = "*"
dask-ms         = "*"
jax             = ">=0.6.0,<0.10.0"
matplotlib      = "*"
numpy           = "*"
numpyro         = "*"
optax           = "*"
# Upper-bounded because the build-system pins jax==0.6.0 (see [build-system]),
# whose jaxlib wheels only cover cp310-cp313; Python 3.14 has no matching wheel.
python          = ">=3.10,<3.14"
python-casacore = "*"
platformdirs    = "*"
pyyaml          = "*"
sgp4jax         = "*"
skyfield        = "*"
spacetrack      = "*"
tqdm            = "*"
xarray          = "*"
zarr            = "<3.0.0"

# ── CPU feature ────────────────────────────────────────────────────────────────
# Used by the default and dev environments on all platforms (including CPU-only
# linux-64 and linux-aarch64). Carries PyPI-only packages (tabascal, tabsim) so
# that GPU environments remain pure conda and are cross-solvable from any host.

[tool.pixi.feature.cpu.dependencies]
jaxlib = "*"

[tool.pixi.feature.cpu.pypi-dependencies]
tabascal = { path = ".", editable = true }

# ── CUDA 12 feature ────────────────────────────────────────────────────────────
# Installs the cuda-enabled jaxlib build from conda-forge and the CUDA 12 build
# toolchain (nvcc, cudart-dev) needed to compile the FFI kernels in
# tabascal/components/ffi. Equivalent jaxlib install:
#   conda install "jaxlib=*=*cuda12*" jax -c conda-forge

[tool.pixi.feature.cuda12]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.feature.cuda12.system-requirements]
cuda = "12"

[tool.pixi.feature.cuda12.dependencies]
jaxlib          = { version = "*", build = "*cuda12*" }
cuda-nvcc       = "12.*"
cuda-cudart-dev = "12.*"

[tool.pixi.feature.cuda12.pypi-dependencies]
tabascal = { path = ".", editable = true }

# The CUDA FFI kernels build automatically: CMake auto-enables them when nvcc and
# the CUDA toolkit are present in the build env (the cuda-nvcc / cuda-cudart-dev
# deps above), so `pixi install -e cuda12` produces libtabascal_cuda.so with no
# activation-env or env-var plumbing. Force on/off with -DTABASCAL_CUDA=ON/OFF
# (or the TABASCAL_CUDA env var, see the [[tool.scikit-build.overrides]] above).

[tool.pixi.feature.cuda12.tasks]
build-ffi-cuda = { cmd = "pixi reinstall -e $PIXI_ENVIRONMENT_NAME tabascal", description = "Rebuild the CUDA FFI shared library (libtabascal_cuda.so) via scikit-build-core/CMake" }

# ── Dev feature ────────────────────────────────────────────────────────────────
# Adds docs and test tooling. Also carries the full PyPI package set so that
# cuda12-dev gets tabascal and friends even though it doesn't include the cpu feature.

[tool.pixi.feature.dev.dependencies]
pytest           = "*"
pytest-cov       = "*"
pre-commit       = "*"
huggingface_hub  = "*"
sphinx           = "*"
sphinx-rtd-theme = "*"
myst-parser      = "*"
graphviz         = "*"

[tool.pixi.feature.dev.pypi-dependencies]
reframe-hpc = "*"
tabsim   = "*"

# ── Environments ───────────────────────────────────────────────────────────────

[tool.pixi.environments]
# CPU environments — lockable from any host platform
default    = { features = ["cpu"],        solve-group = "cpu" }
dev        = { features = ["cpu", "dev"], solve-group = "cpu" }

# NVIDIA GPU environments — pure conda, lockable from any host platform
cuda12     = { features = ["cuda12"],        solve-group = "cuda12" }
cuda12-dev = { features = ["cuda12", "dev"], solve-group = "cuda12" }

[build-system]
requires = [
    "scikit-build-core>=0.10",
    "jax==0.6.0", # Use minimum FFI api to build
]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
cmake.source-dir = "."
wheel.packages = ["tabascal"]
wheel.py-api = "py3"

[[tool.scikit-build.overrides]]
if.env.TABASCAL_CUDA = "(?i)1|on|true|yes"
cmake.define.TABASCAL_CUDA = "ON"

[[tool.scikit-build.overrides]]
if.env.TABASCAL_ROCM = "(?i)1|on|true|yes"
cmake.define.TABASCAL_ROCM = "ON"

# ── Project metadata ───────────────────────────────────────────────────────────

[project]
name = "tabascal"
version = "0.0.1"
license = {file = "LICENSE"}
readme = "README.md"
authors = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"},
]
maintainers = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"}
]
description = "Trajectory based Radio Frequency Interference (RFI) subtraction and calibration using Bayesian methods for radio interferometeric data."

requires-python = ">=3.10"
dependencies = [
    "dask",
    "dask-ms",
    "jax>=0.6.0,<0.10",
    "matplotlib",
    "numpy",
    "numpyro",
    "optax",
    "platformdirs",
    "PyYAML",
    "sgp4jax>=0.1.6,<0.2",  # enables jax x64 at import; orbit API is pre-1.0
    "skyfield>=1.49,<2",  # uses skyfield's _utc_jd(whole, fraction); see tabascal/time.py
    "spacetrack",
    "tqdm",
    "xarray",
]

[project.optional-dependencies]
test  = ["pytest", "pytest-cov", "huggingface-hub", "tabsim"]
docs  = ["sphinx", "sphinx-rtd-theme"]
dev   = ["pre-commit", "reframe-hpc", "tabascal[test,docs]"]
cuda12 = ["jax[cuda12]"]
cuda13 = ["jax[cuda13]"]

[project.urls]
Repository = "https://github.com/epfl-radio-astro/tabascal.git"

[project.scripts]
tabascal = "tabascal.scripts.run_tabascal:main"
tab2MS = "tabascal.scripts.results_to_MS:main"

# ── Pytest ─────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
# testpaths makes tests/ the initial collection path when pytest is run with no path
# argument (as CI does). This loads tests/conftest.py as an *initial* conftest, so its
# --x64 option is registered before command-line parsing -- without it, pytest 9.1+ errors
# "unrecognized arguments: --x64" on the `pytest --x64 false` single-precision invocation.
testpaths     = ["tests"]
log_cli       = true
log_cli_level = "WARNING"
addopts       = "--cov=tabascal --cov-report=term-missing"

# ── Coverage ────────────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["tabascal"]
omit = [
    "tabascal/plot.py",          # matplotlib plotting, not unit-tested
    "tabascal/scripts/*",        # CLI entry points
]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# ── Pixi ──────────────────────────────────────────────────────────────────────
# name / version / description / python are inherited from [project] above.

[tool.pixi.workspace]
channels  = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "linux-aarch64"]

# ── Tasks ──────────────────────────────────────────────────────────────────────

# Available in every environment (default feature). Verifies the FFI libraries
# load and the CPU/GPU kernels actually execute on each device JAX sees; exits
# non-zero (CI-usable) if a required kernel is missing or broken.
[tool.pixi.tasks]
check-install = { cmd = "python -m tabascal.scripts.check_install", description = "Verify the env: FFI libraries load and the CPU/GPU kernels run" }

[tool.pixi.feature.dev.tasks]
build-ffi = { cmd = "pixi reinstall -e $PIXI_ENVIRONMENT_NAME tabascal", description = "Rebuild the CPU FFI shared library (libtabascal.so) via scikit-build-core/CMake" }
test           = "pytest tests/"
test-components = { cmd = "pytest tests/components/", description = "Run component tests only" }
coverage       = { cmd = "pytest tests/ --cov-report=html", description = "Run tests with coverage and write an HTML report to htmlcov/" }
docs-build     = "sphinx-build -b html docs/ docs/_build/html"
docs-clean     = { cmd = "rm -rf docs/_build", description = "Remove built docs" }
perf-test      = { cmd = "reframe -C ci/reframe/settings.py -c ci/reframe/tabascal_perf_check.py --system=generic --exec-policy=serial --run --performance-report --report-file=reframe_results.json", description = "Run Re-Frame performance benchmark locally" }

# ── Shared conda dependencies (all environments) ───────────────────────────────

[tool.pixi.dependencies]
casacore        = "*"
cxx-compiler    = "*"
dask            = "*"
dask-ms         = "*"
jax             = ">=0.6.0,<0.10.0"
matplotlib      = "*"
numpy           = "*"
numpyro         = "*"
optax           = "*"
# Upper-bounded because the build-system pins jax==0.6.0 (see [build-system]),
# whose jaxlib wheels only cover cp310-cp313; Python 3.14 has no matching wheel.
python          = ">=3.10,<3.14"
python-casacore = "*"
platformdirs    = "*"
pyyaml          = "*"
# Bounded: sgp4jax enables jax_enable_x64 at import (set_precision relies on this
# ordering) and its orbit API is pre-1.0, so pin a known-good range.
sgp4jax         = ">=0.1.6,<0.2"
# Bounded: tabascal/time.py and components/trajectory.py call skyfield's private
# _utc_jd(whole, fraction); pin a known-good range and guard it with a smoke test.
skyfield        = ">=1.49,<2"
spacetrack      = "*"
tqdm            = "*"
xarray          = "*"
zarr            = "<3.0.0"

# ── CPU feature ────────────────────────────────────────────────────────────────
# Used by the default and dev environments on all platforms (including CPU-only
# linux-64 and linux-aarch64). Carries PyPI-only packages (tabascal, tabsim) so
# that GPU environments remain pure conda and are cross-solvable from any host.

[tool.pixi.feature.cpu.dependencies]
jaxlib = "*"

[tool.pixi.feature.cpu.pypi-dependencies]
tabascal = { path = ".", editable = true }

# ── CUDA 12 feature ────────────────────────────────────────────────────────────
# Installs the cuda-enabled jaxlib build from conda-forge and the CUDA 12 build
# toolchain (nvcc, cudart-dev) needed to compile the FFI kernels in
# tabascal/components/ffi. Equivalent jaxlib install:
#   conda install "jaxlib=*=*cuda12*" jax -c conda-forge

[tool.pixi.feature.cuda12]
platforms = ["linux-64", "linux-aarch64"]

[tool.pixi.feature.cuda12.system-requirements]
cuda = "12"

[tool.pixi.feature.cuda12.dependencies]
jaxlib          = { version = "*", build = "*cuda12*" }
cuda-nvcc       = "12.*"
cuda-cudart-dev = "12.*"

[tool.pixi.feature.cuda12.pypi-dependencies]
tabascal = { path = ".", editable = true }

# Enables the CUDA FFI kernel build (scikit-build-core override in [tool.scikit-build]
# maps this env var to -DTABASCAL_CUDA=ON; CMake stays CPU-only by default). This is
# active during `pixi run`/`pixi shell` and during a per-env (re)build of tabascal in
# this env — i.e. `pixi run -e cuda12 build-ffi-cuda`, which is how the CUDA kernel
# gets built. A plain `pixi install` does NOT build it: pixi/uv build the editable
# tabascal once and share that single (CPU) wheel across every env, so cuda12 inherits
# the CPU-only build until build-ffi-cuda forces a cuda12-specific rebuild. See the
# "Build the FFI shared libraries" section of the README.
[tool.pixi.feature.cuda12.activation.env]
TABASCAL_CUDA = "1"

[tool.pixi.feature.cuda12.tasks]
build-ffi-cuda = { cmd = "pixi reinstall -e $PIXI_ENVIRONMENT_NAME tabascal", description = "Rebuild the CUDA FFI shared library (libtabascal_cuda.so) via scikit-build-core/CMake" }

# ── Dev feature ────────────────────────────────────────────────────────────────
# Adds docs and test tooling. Also carries the full PyPI package set so that
# cuda12-dev gets tabascal and friends even though it doesn't include the cpu feature.

[tool.pixi.feature.dev.dependencies]
pytest           = "*"
pytest-cov       = "*"
pre-commit       = "*"
huggingface_hub  = "*"
sphinx           = "*"
sphinx-rtd-theme = "*"
myst-parser      = "*"
graphviz         = "*"

[tool.pixi.feature.dev.pypi-dependencies]
reframe-hpc = "*"
tabsim   = "*"

# ── Environments ───────────────────────────────────────────────────────────────

[tool.pixi.environments]
# CPU environments — lockable from any host platform
default    = { features = ["cpu"],        solve-group = "cpu" }
dev        = { features = ["cpu", "dev"], solve-group = "cpu" }

# NVIDIA GPU environments — pure conda, lockable from any host platform
cuda12     = { features = ["cuda12"],        solve-group = "cuda12" }
cuda12-dev = { features = ["cuda12", "dev"], solve-group = "cuda12" }

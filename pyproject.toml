[build-system]
# XXX: If your project needs other packages to build properly, add them to this list.
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "tabascal"
version = "0.0.1"
license = {file = "LICENSE"}
readme = "README.md"
# dynamic = ["version", "readme"]
authors = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"},
]
maintainers = [
  {name = "Chris Finlay", email = "christopher.finlay@epfl.ch"}
]
description = "Trajectory based Radio Frequency Interference (RFI) subtraction and calibration using Bayesian methods for radio interferometeric data."

requires-python = ">=3.9"
dependencies = [
    "tabsim", "numpyro", "optax", 
]

[project.optional-dependencies]
gpu = ["jax[cuda12]"]
ipy = ["ipython", "ipykernel"]
test = ["pytest"]
docs = ["sphinx", "sphinx-rtd-theme"]

[project.urls]
Repository = "https://github.com/epfl-radio-astro/tabascal.git"

[tool.setuptools.packages.find]
where = ["."]

[project.scripts]
old-tab = "tabascal.deprecated.run_tabascal:main"
tabascal = "tabascal.scripts.run_tabascal:main"
tab2MS="tabascal.scripts.results_to_MS:main"

[pytest]
log_cli = true

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "WARNING"

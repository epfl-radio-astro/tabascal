model:
  precision: single
  components:
    # RFI phase, signal and visibilities on the data grid, each cell
    # integrated in closed form (docs/analytic_rfi_vis.md)
    - trajectory.FixedOrbit
    - rfi_signal.ComplexRFIVarAnt:
        init: truth
        mean: 0
        corr_time_s: 24
        freq_pad_factor: 2.0
        time_pad_factor: 2.0
    - rfi_vis.AnalyticVis:
        n_int_freq: 1
    # Astronomical signal model
    - ast_vis.GPVisAst:
        init: truth
        mean: 0
        cutoff: 1e-6
        std_jy: 1.5           # Widest true-sky baseline in the 8A simulation is rms|V| = 2.897 Jy
        corr_freq_hz: null    # no frequency roll-off; these observations are single channel
        fov_deg: 5
        gammas: [5, 5]
        freq_pad_factor: 2.0
        time_pad_factor: 2.0
    # Antenna Gain model
    - gains.UnitaryGains

data:
  data_col: DATA
  noise_jy: null

plots:
  init: true
  prior: true
  truth: false
  prior_samples: 100

inference:
  opt: true

opt:
  epsilon: 1e-3
  max_iter: 1000
  dual_run: true
  guide: map

satellites:
  norad_ids: [20452, 38833, 45854]

model:
  components:
  # RFI Phase from trajectory
    - trajectory:FixedOrbit
    # - trajectory:NoDragOrbit
    # - trajectory:Orbit
    # - trajectory:PhaseCalculationRFI
  # RFI signal model
    - rfi_signal:ComplexRFIVarAnt
    # - rfi_signal:ComplexRFIConstAnt
  # RFI visibility calculation
    # - rfi_vis:RiemannVis
    - rfi_vis:RiemannVisVariableFFI
  # Astronomical signal model
    - ast_vis:GPVisAst
  # Antenna Gain model 
    - gains:UnitaryGains

data:
  data_col: DATA
  noise: 

plots:
  init: True
  # truth: True
  prior: True
  # init: False
  truth: False
  # prior: False
  prior_samples: 100

inference:
  mcmc: False
  opt: True
  # opt: False
  fisher: False

opt:
  epsilon: 1e-3
  max_iter: 1000
  dual_run: True
  guide: map

fisher:
  n_samples: 1
  max_cg_iter: 10_000

# Priors and Initialization
ast:
  # init: sample
  # init: prior
  # init: data
  # init: zeros
  init: truth
  mean: 0
  # mean: data
  pow_spec:
    std: 2.9           # Widest true-sky baseline in the 8A simulation is rms|V| = 2.897 Jy, so every baseline's sky sits inside 1 sigma of this prior; see docs/config.md
    corr_freq: null   # no frequency roll-off; these observations are single channel
    fov_deg: 5
    gammas: [5, 5]
    cutoff: 1e-6
  freq_pad_factor: 2.0
  time_pad_factor: 2.0

rfi:
  # init: est
  # init: prior
  init: truth
  mean: 0
  # mean: est
  # mean: truth
  # var: 100        # Jy
  corr_time: 24   # seconds
  freq_pad_factor: 2.0
  time_pad_factor: 2.0
  n_int_freq: 1
  time_int_factor: 5

satellites:
  norad_ids: [20452, 38833, 45854]
  # n_int_samples: 3
  ric_std: 1e2


# True gains
gains:
  amp_mean: 1.0
  phase_mean: 0.0
  # amp_mean: truth
  # phase_mean: truth
  amp_std: 1.0      # %
  phase_std: 1.0    # degrees

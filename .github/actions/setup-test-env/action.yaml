name: 'Setup Test Environment'
description: 'Set up Python, caching, and install test dependencies'

inputs:
  python-version:
    description: 'Python version to set up'
    required: true

outputs:
  tabsim-version:
    description: 'The installed tabsim version'
    value: ${{ steps.tabsim-version.outputs.version }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Get tabsim version for cache key
      id: tabsim-version
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install tabsim
        VERSION=$(python -c "import tabsim; print(tabsim.__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Tabsim version: $VERSION"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ inputs.python-version }}-${{ hashFiles('pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ inputs.python-version }}-
          ${{ runner.os }}-pip-

    # The v2 marker retires every cache entry saved before the pipeline tests
    # stopped running against the downloaded sim in place. Those runs wrote their
    # results, plots and logs into the snapshot and rewrote files of the dataset
    # itself, and the restore-keys carried the damage forward from one key to the
    # next. Bump the marker again if anything is ever found writing there.
    - name: Cache HuggingFace datasets
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-huggingface-v2-tabsim-${{ steps.tabsim-version.outputs.version }}-${{ hashFiles('tests/data/*.yaml') }}
        restore-keys: |
          ${{ runner.os }}-huggingface-v2-tabsim-${{ steps.tabsim-version.outputs.version }}-
          ${{ runner.os }}-huggingface-v2-

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[test]"

name: Tests

on:
  workflow_dispatch:
    branches:
      - '**'
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '**'

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    # Without this a hung child rides the 6-hour default: on 2026-08-10 all three
    # jobs sat at test_pipeline_sharded_equivalence[RiemannVisFFI]
    # until that limit, burning a runner each. Re-running the same commit unchanged
    # passed, so the trigger is runner contention rather than the code. Deliberately
    # a CI-only limit -- the suite runs in ~15 min here, but a slow dev machine is
    # free to take as long as it needs.
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: ${{ matrix.python-version }}

      # Pass the tests/ path explicitly: the --x64 option is defined in
      # tests/conftest.py, and since pytest 9.1 a bare `pytest` (no path) does not
      # load that subdirectory conftest early enough to register the option, so
      # `pytest --x64 false` below fails with "unrecognized arguments: --x64".
      # Naming tests/ makes it an initial conftest and registers --x64 in time.
      - name: Run pytest (double precision)
        run: |
          pytest tests/ -v --tb=short --color=yes

      # tabascal defaults to single precision (model.precision: single), so guard
      # that path explicitly. requires_double tests skip; the single-capable
      # pipeline cases run against their fp32 chi^2 references. Pipeline test data
      # is cached by the double run above, so this is fast.
      - name: Run pytest (single precision)
        run: |
          pytest tests/ -v --tb=short --color=yes --x64 false --no-cov

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      # Only to push the badge payload to the orphan `badges` branch below.
      contents: write
    env:
      # Lifted to the job so the upload step can be gated on whether it is set;
      # the secrets context is not available in a step-level `if`.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup test environment
        uses: ./.github/actions/setup-test-env
        with:
          python-version: '3.11'

      - name: Run pytest with coverage
        run: |
          pytest tests/ --cov=tabascal --cov-report=xml --cov-report=html --cov-report=term -v

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
          retention-days: 30

      # Feeds the README's codecov badge. Codecov rejects tokenless uploads even
      # for public repos ("Token required - not valid tokenless upload"), so the
      # step is skipped without CODECOV_TOKEN rather than run and fail: with
      # fail_ci_if_error off, a failed upload still reports success, which is how
      # the badge sat at "unknown" while CI stayed green.
      - name: Upload coverage to Codecov
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ env.CODECOV_TOKEN }}
          fail_ci_if_error: true

      # The README badge is served from this repo rather than a third party:
      # Codecov cannot see an org until its app is approved there, which is not
      # ours to grant. Writes a shields.io endpoint payload to an orphan `badges`
      # branch, so main's history stays free of per-run commits.
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET

          rate = float(ET.parse("coverage.xml").getroot().get("line-rate")) * 100
          color = next(
              c for limit, c in [
                  (50, "red"), (70, "orange"), (80, "yellow"),
                  (90, "yellowgreen"), (101, "brightgreen"),
              ] if rate < limit
          )
          json.dump(
              {"schemaVersion": 1, "label": "coverage",
               "message": f"{rate:.0f}%", "color": color},
              open("coverage.json", "w"),
          )
          print(f"coverage {rate:.1f}% -> {color}")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create the branch from an empty tree the first time round.
          git fetch origin badges:badges 2>/dev/null \
            || git branch badges "$(git commit-tree "$(git hash-object -t tree /dev/null)" -m 'init badges')"

          git worktree add ../badges badges
          cp coverage.json ../badges/
          git -C ../badges add coverage.json
          git -C ../badges diff --cached --quiet \
            || git -C ../badges commit -m "coverage badge for ${GITHUB_SHA::7}"
          git -C ../badges push origin badges

      - name: Coverage summary
        run: |
          echo "## Test Coverage Summary" >> $GITHUB_STEP_SUMMARY
          python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib['line-rate']) * 100
          branch_rate = float(root.attrib['branch-rate']) * 100
          print(f'- Line Coverage: {line_rate:.1f}%')
          print(f'- Branch Coverage: {branch_rate:.1f}%')
          " >> $GITHUB_STEP_SUMMARY || echo "Coverage parsing failed"

  build:
    # Catches metadata problems at PR time rather than at release time, when the
    # tag is already pushed and a bad upload cannot be replaced on PyPI. The
    # release workflow (release.yaml) builds the same distributions on publish.
    name: Build and check distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build

      - name: Check metadata
        run: twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          retention-days: 7

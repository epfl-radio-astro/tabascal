name: Simulation data

# The pipeline tests and the ReFrame benchmark download their input simulations
# from the epfl-radio-astro/rfi-simulations HuggingFace dataset, from the branch
# named after the installed tabsim (tabsim_v<version>). Once a day this checks
# whether the latest tabsim release has a simulation there for every
# sim_target*.yaml, and if not, simulates the missing ones with that release and
# uploads them. Until then, CI regenerates the data itself on every run.
#
# Secrets, in the tabsim_huggingface environment:
#   HF_TOKEN             HuggingFace token with write access to the dataset

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

# Two runs for the same release would both simulate and both upload.
concurrency:
  group: simulation-data

jobs:
  publish:
    name: Publish simulations
    # The nightly run publishes main's sim configs. A manual run may also be
    # started from another branch of this repository, to publish the simulations
    # a pending change to the configs or the tabsim pin needs before it merges:
    # each is stored under its config's hash, so it cannot replace main's. Forks
    # run schedules too, without the secrets to publish anything.
    if: >-
      github.repository == 'epfl-radio-astro/tabascal'
      && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    # Holds the secrets below. Its deployment-branch policy is what decides which
    # branches may read them: main, plus any branch added for a manual publish.
    environment: tabsim_huggingface
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # Only huggingface_hub, so a day with nothing to do stays cheap.
      - name: Check for missing simulations
        id: check
        run: |
          python -m pip install --upgrade pip
          pip install huggingface-hub
          python ci/rfi_simulations.py check

      # Through the test extra, so tabsim runs against the same dependency
      # bounds (xarray, zarr, ...) as the tests that will read its output. tabsim
      # is pinned to the version checked above in case a release lands meanwhile.
      - name: Install tabsim ${{ steps.check.outputs.version }}
        if: steps.check.outputs.missing == 'true'
        run: |
          pip install ".[test]" "tabsim==${{ steps.check.outputs.version }}"

      - name: Simulate and upload
        if: steps.check.outputs.missing == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python ci/rfi_simulations.py publish --expect-version "${{ steps.check.outputs.version }}"

# Publishes to PyPI when a GitHub release is published.
#
# Uses PyPI Trusted Publishing (OIDC), so there is no API token to store. Before
# the first release, add a trusted publisher on PyPI for this project:
#
#   PyPI -> your project -> Publishing -> Add a new publisher (GitHub)
#     Owner:       epfl-radio-astro
#     Repository:  tabascal
#     Workflow:    release.yaml
#     Environment: pypi
#
# For the very first upload the project does not exist on PyPI yet, so register
# a *pending* publisher instead, under Account settings -> Publishing.
name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      # The tag is the release's name; a mismatch against the packaged version
      # means the wrong commit was tagged. Better to fail here than to publish an
      # immutable, wrongly-numbered artefact.
      - name: Verify tag matches package version
        run: |
          pkg_version=$(python -c "import tomllib; \
            print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag package=$pkg_version"
          [ "$tag" = "$pkg_version" ] || {
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg_version"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

name: Docs

# The docs are published by Read the Docs, which builds them from
# .readthedocs.yaml on every activated branch and tag. This workflow does not
# publish anything -- it builds the same docs with warnings as errors so a
# broken build shows up on the pull request rather than as a red Read the Docs
# build after the merge.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - '**'

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      # sphinx.ext.graphviz shells out to `dot` for the component graph.
      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[docs]"

      # -W mirrors fail_on_warning in .readthedocs.yaml; --keep-going reports
      # every warning in one run instead of stopping at the first.
      - name: Build docs
        run: |
          sphinx-build -b html -W --keep-going docs docs/_build/html

      - name: Upload built docs
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          retention-days: 14

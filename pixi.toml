[workspace]
name = "tabascal"
version = "0.0.1"
description = "Trajectory-based RFI subtraction for radio interferometric data"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

# ── Tasks ──────────────────────────────────────────────────────────────────────

[tasks]
test = "pytest tests/"
test-components = "pytest tests/components/"
docs-build = "sphinx-build -b html docs/ docs/_build/html"
docs-clean = { cmd = "rm -rf docs/_build", description = "Remove built docs" }
build-ffi     = { cmd = "make cpu",  cwd = "tabascal/components/ffi", description = "Compile CPU FFI shared library (tabascal.so)" }
build-ffi-cuda = { cmd = "make cuda", cwd = "tabascal/components/ffi", description = "Compile CUDA FFI shared library (tabascal_cuda.so)" }
build-ffi-hip  = { cmd = "make hip",  cwd = "tabascal/components/ffi", description = "Compile HIP/ROCm FFI shared library (tabascal_hip.so)" }

# ── Shared conda dependencies (all environments) ───────────────────────────────

[dependencies]
python = ">=3.10,<3.13"
cxx-compiler = "*"
astropy = "*"
casacore = "*"
dask = "*"
matplotlib = "*"
numpy = "*"
python-casacore = "*"
pyyaml = "*"
skyfield = "*"
tqdm = "*"
xarray = "*"

# ── CPU feature ────────────────────────────────────────────────────────────────
# Used by the default and dev environments on all platforms (including CPU-only
# linux-64 and linux-aarch64). Carries all PyPI-only packages so that GPU
# environments (which must be locked on a native linux machine) remain pure
# conda and are cross-solvable from any host platform.

[feature.cpu.dependencies]
jax = ">=0.6.0,<0.10.0"
numpyro = "*"
optax = "*"

[feature.cpu.pypi-dependencies]
tabascal = { path = ".", editable = true }
dask-ms = "*"
sgp4jax = "*"
tabsim = "*"
spacetrack = "*"

# ── CUDA 12 feature ────────────────────────────────────────────────────────────
# linux-64 (NVIDIA) and linux-aarch64 (NVIDIA GH200 etc.).
# Installs the cuda-enabled jaxlib build from conda-forge, equivalent to:
#   conda install "jaxlib=*=*cuda12*" jax -c conda-forge
# Pure conda — no PyPI deps — so the lockfile can be generated from any host.
# Use cuda12-dev for a full development install including tabascal and tooling.

[feature.cuda12]
platforms = ["linux-64", "linux-aarch64"]

[feature.cuda12.system-requirements]
cuda = "12"

[feature.cuda12.dependencies]
jax = ">=0.6.0,<0.10.0"
jaxlib = { version = "*", build = "*cuda12*" }
numpyro = "*"
optax = "*"

# ── ROCm feature ───────────────────────────────────────────────────────────────
# linux-64 (AMD GPU) only. jax[rocm] is PyPI-only and has native extensions,
# so this environment can only be locked from a linux-64 machine.

[feature.rocm]
platforms = ["linux-64"]

[feature.rocm.dependencies]
jax = ">=0.6.0,<0.10.0"
numpyro = "*"
optax = "*"

[feature.rocm.pypi-dependencies]
# Installs jax-rocm plugin on top of conda jax; ROCm backend takes over at
# runtime. Note: jax[rocm] has native extensions so this environment's
# lockfile entries can only be generated on a linux-64 host.
jax = { version = ">=0.6.0,<0.10.0", extras = ["rocm"] }

# ── Dev feature ────────────────────────────────────────────────────────────────
# Adds docs and test tooling. Also carries the full PyPI package set so that
# cuda12-dev and rocm-dev environments get tabascal and friends even though
# they don't include the cpu feature.

[feature.dev.dependencies]
pytest = "*"
huggingface_hub = "*"
sphinx = "*"
sphinx-rtd-theme = "*"
myst-parser = "*"
graphviz = "*"

[feature.dev.pypi-dependencies]
tabascal = { path = ".", editable = true }
dask-ms = "*"
sgp4jax = "*"
tabsim = "*"
spacetrack = "*"

# ── Environments ───────────────────────────────────────────────────────────────

[environments]
# CPU environments — lockable from any host platform
default = { features = ["cpu"], solve-group = "cpu" }
dev     = { features = ["cpu", "dev"], solve-group = "cpu" }

# NVIDIA GPU environments — pure conda, lockable from any host platform
cuda12     = { features = ["cuda12"], solve-group = "cuda12" }
cuda12-dev = { features = ["cuda12", "dev"], solve-group = "cuda12" }

# AMD GPU environments — requires locking from a linux-64 host
rocm     = { features = ["rocm"], solve-group = "rocm" }
rocm-dev = { features = ["rocm", "dev"], solve-group = "rocm" }

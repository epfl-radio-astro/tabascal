[workspace]
name = "tabascal"
version = "0.0.1"
description = "Trajectory-based RFI subtraction for radio interferometric data"
channels = ["conda-forge"]
platforms = ["osx-64", "osx-arm64", "linux-64", "linux-aarch64"]

# ── Tasks ──────────────────────────────────────────────────────────────────────

[feature.dev.tasks]
build-ffi      = { cmd = "make cpu",  cwd = "tabascal/components/ffi", description = "Compile CPU FFI shared library (tabascal.so)" }
build-ffi-cuda = { cmd = "make cuda", cwd = "tabascal/components/ffi", description = "Compile CUDA FFI shared library (tabascal_cuda.so)" }
test           = "pytest tests/"
test-components = "pytest tests/components/"
test-inventory = { cmd = "python scripts/generate_test_inventory.py", description = "Regenerate tests/TEST_INVENTORY.md from docstrings" }
docs-build     = "sphinx-build -b html docs/ docs/_build/html"
docs-clean     = { cmd = "rm -rf docs/_build", description = "Remove built docs" }
perf-test      = { cmd = "python ci/reframe/prepare_data.py --components 'trajectory:FixedOrbit,rfi_signal:ComplexRFI,rfi_vis:RiemannVisTimeFreqCalculation,ast_vis:FourierTimeFreqGPAst,gains:UnitaryGains' --workdir /tmp/tab-perf --src-root . && python tabascal/scripts/run_tabascal.py -c /tmp/tab-perf/tab_target.yaml -s $(cat /tmp/tab-perf/sim_dir.txt) -t", description = "Run performance benchmark locally (Riemann variant)" }

# ── Shared conda dependencies (all environments) ───────────────────────────────

[dependencies]
python = ">=3.10,<=3.13"
astropy = "*"
casacore = "*"
dask = "*"
dask-ms = "*"
jax = ">=0.6.0,<0.10.0"
matplotlib = "*"
numpy = "*"
numpyro = "*"
optax = "*"
python-casacore = "*"
pyyaml = "*"
sgp4jax = "*"
skyfield = "*"
spacetrack = "*"
tqdm = "*"
xarray = "*"
zarr = "<3.0.0"

# ── CPU feature ────────────────────────────────────────────────────────────────
# Used by the default and dev environments on all platforms (including CPU-only
# linux-64 and linux-aarch64). Carries PyPI-only packages (sgp4jax, tabsim) so
# that GPU environments remain pure conda and are cross-solvable from any host.

[feature.cpu.dependencies]
jaxlib = "*"

[feature.cpu.pypi-dependencies]
tabascal = { path = ".", editable = true }
tabsim = "*"

# ── CUDA 12 feature ────────────────────────────────────────────────────────────
# Installs the cuda-enabled jaxlib build from conda-forge, equivalent to:
#   conda install "jaxlib=*=*cuda12*" jax -c conda-forge
# Use cuda12-dev for a full development install including tabascal and tooling.

[feature.cuda12]
platforms = ["linux-64", "linux-aarch64"]

[feature.cuda12.system-requirements]
cuda = "12"

[feature.cuda12.dependencies]
jaxlib = { version = "*", build = "*cuda12*" }

# ── Dev feature ────────────────────────────────────────────────────────────────
# Adds docs and test tooling. Also carries the full PyPI package set so that
# cuda12-dev gets tabascal and friends even though it doesn't include the cpu feature.

[feature.dev.dependencies]
cxx-compiler = "*"
pytest = "*"
pre-commit = "*"
huggingface_hub = "*"
sphinx = "*"
sphinx-rtd-theme = "*"
myst-parser = "*"
graphviz = "*"

[feature.dev.pypi-dependencies]
tabascal = { path = ".", editable = true }
tabsim = "*"

# ── Environments ───────────────────────────────────────────────────────────────

[environments]
# CPU environments — lockable from any host platform
default = { features = ["cpu"], solve-group = "cpu" }
dev     = { features = ["cpu", "dev"], solve-group = "cpu" }

# NVIDIA GPU environments — pure conda, lockable from any host platform
cuda12     = { features = ["cuda12"], solve-group = "cuda12" }
cuda12-dev = { features = ["cuda12", "dev"], solve-group = "cuda12" }

# NVIDIA GPU environments — pure conda, lockable from any host platform
cuda13     = { features = ["cuda13"], solve-group = "cuda13" }
cuda13-dev = { features = ["cuda13", "dev"], solve-group = "cuda13" }
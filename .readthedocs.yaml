# Read the Docs build configuration.
#
# Read the Docs builds one copy of the docs per *version*, where a version is a
# git tag or branch that has been activated in the project admin. Which versions
# exist, and which one is served by default, is a project setting rather than
# something configured here -- see docs/readthedocs.md for the version policy and
# the one-time project setup. This file only describes how a single version is
# built, so it has to be present on every branch and tag that should be built.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # sphinx.ext.graphviz shells out to `dot` (the component graph in
    # docs/components.rst); without it the build fails on a missing binary.
    - graphviz

# autodoc imports tabascal, so the package itself has to be installed. It is pure
# Python (the compiled kernels live in the ri_kernels dependency), so this is a
# plain wheel install with no build toolchain involved.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  # The docs build warning-free today, and the docs workflow builds with -W on
  # every pull request, so a warning here means something regressed.
  fail_on_warning: true
